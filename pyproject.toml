[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testrx-retriever"
version = "0.1.0"
description = "Provenance-preserving TESTRX manual parser and retrieval evaluation corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pdfplumber>=0.11,<0.12",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
transformers = [
    "sentence-transformers>=5,<6",
]

[project.scripts]
testrx-parse = "testrx_retriever.cli:main"
testrx-baseline = "testrx_retriever.workflows.reference_run:main"
testrx-experiments = "testrx_retriever.experiments:main"
testrx-analyze = "testrx_retriever.evaluation.analysis:main"
testrx-pipeline = "testrx_retriever.workflows.model_comparison:main"
testrx-hierarchy-experiment = "testrx_retriever.workflows.hierarchy_experiment:main"
testrx-retrieve = "testrx_retriever.workflows.retrieve:main"

[tool.setuptools.packages.find]
where = ["src"]
